
<div class="mt-2 mb-2 p-3 bg-secondary text-white rounded ">
 <h1>Attribute directive</h1>
      <span>[*ngClass], [*ngStyle]</span>
</div>

<div class="row"> 
    <div class="col-3">
        <div  class="p-3 text-center" [ngClass]="div1BgColor">
            <h4>Div-1</h4>
        </div>
    </div>
    <div class="col-3">
        <div class=" p-3 text-center" [ngClass]="isDiv2Active == true ? 'bg-success' : 'bg-warning'">
            <h4>Div-2</h4>
        </div>
    </div>
    <div class="col-3" >
        <div  class="p-3 text-center" [ngClass]="num1 == num2 ? 'bg-info text-secondary' : 'bg-secondary text-white'">
            <h4>Div-3</h4>
        </div>
    </div>
    <div class="col-3">
        <div class="p-3 text-center" [ngClass]="isCheckBoxActive ? 'bg-primary' : 'bg-success'">
            <h4>Div-4</h4>
        </div>
    </div>
</div>

<div class="row pt-3">
    <div class="col-3 text-center">
        <button class="btn btn-danger" (click)="addRedClass()">Add Red</button>
        <button class="btn btn-primary mx-2" (click)="addBlueClass()">Add Blue</button>
    </div>
    <div class="col-3 text-center">
        <button class="btn btn-success" (click)="toggleDiv2Class()">Toggle</button>
    </div>
    <div class="col-3">
        <div class="d-flex align-item-center">
           <input type="text" [(ngModel)]="num1" placeholder="Nam-1" width="50">
           <input type="text"  [(ngModel)]="num2"  placeholder="Nam-2" width="50">
        </div>
   
    </div>
    <div class="col-3 pt-3">
        <div class="d-flex justify-content-between align-item-center">
         <input type="checkbox" class="mx-5" [(ngModel)]="isCheckBoxActive" >
          <select class="mx-4">
            <option>Select State</option>
            <option>India</option>
            <option>USA</option>
            <option>Rassia</option>
           </select>
        </div>

    </div>
</div>




<div class="row mt-5 mx-4">
    <div class="col-5">
        <div class="table table-striped table-bordered table-hover">
            <thead class="thead-dark">
                <tr>
                    <th>Sr No</th>
                    <th>Name</th>
                    <th>City</th>
                    <th>Total Mark</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let student of studentList let sr = index">
                    <td>{{sr}}</td>
                    <td>{{student.name}}</td>
                    <td>{{student.city}}</td>
                    <td>
                        <div class="progress">
  <div class="progress-bar bg-info text-white" role="progressbar"[ngStyle]="{'width':student.totalMarks+'%'}" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">{{student.totalMarks+'%'}}</div>
</div>
                       

                    </td>
                    <td [ngStyle]="{'color': student.isPersent ? 'green' : 'red'}">
                        <span>{{student.isPersent ? 'Active': 'De-Active'}}</span>
                    </td>
                </tr>
            </tbody>
        </div>
    </div>
</div>
